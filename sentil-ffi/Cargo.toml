[package]
name = "sentil-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable C ABI for SENTIL, the runtime verification engine for STL and PrSTL"

[lib]
name = "sentil"
crate-type = ["cdylib", "staticlib"]
doctest = false

[dependencies]
sentil = { path = "../sentil-core", features = ["serde", "gpu"] }
libc = "0.2"
serde_json = "1.0"
rand = { workspace = true }
rand_chacha = { workspace = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
cc = "1.0"
tempfile = "3"