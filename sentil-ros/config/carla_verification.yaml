sentil_monitor:
  ros__parameters:
    use_sim_time: true
    formulas: ["speed_limit", "following_distance", "pedestrian_clearance", "collision_risk"]

    formulas.speed_limit:
      formula: "always[0,10] (speed < 12.0)"
      verification:
        method: "robustness"
      signal_names: ["speed"]
      variables:
        speed:
          topic: "/carla/hero/odometry"
          field: "twist.twist.linear.x"
          type: "nav_msgs/msg/Odometry"

    formulas.following_distance:
      formula: "always[0,10] (front_distance > 6.0)"
      verification:
        method: "robustness"
      signal_names: ["front_distance"]
      variables:
        front_distance:
          topic: "/carla/hero/front_range"
          field: "range"
          type: "sensor_msgs/msg/Range"

    formulas.pedestrian_clearance:
      formula: "always[0,10] (pedestrian_distance > 5.0)"
      verification:
        method: "robustness"
      signal_names: ["pedestrian_distance"]
      variables:
        pedestrian_distance:
          topic: "/carla/hero/pedestrian_range"
          field: "range"
          type: "sensor_msgs/msg/Range"

    formulas.collision_risk:
      formula: "P>=0.95(always[0,10] (pedestrian_distance > 4.0))"
      verification:
        method: "smc"
      signal_names: ["pedestrian_distance"]
      variables:
        pedestrian_distance:
          topic: "/carla/hero/pedestrian_range"
          field: "range"
          type: "sensor_msgs/msg/Range"
          noise:
            type: "gaussian"
            mean: 0.0
            std_dev: 0.6
      config:
        particles: 1000
        confidence: 0.95