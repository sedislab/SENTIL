services:
  sentil-verify:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    image: ghcr.io/sedislab/sentil-artifact:0.3.0

  sentil-modest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    image: ghcr.io/sedislab/sentil-artifact:0.3.0
    volumes:
      - ${MODEST_HOME:-.}:/opt/modest:ro
      - ../benchmarks/results:/sentil/benchmarks/results
    command: make bench-modest MODEST=/opt/modest/modest

  sentil-prism:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    image: ghcr.io/sedislab/sentil-artifact:0.3.0
    volumes:
      - ${PRISM_HOME:-.}:/opt/prism:ro
      - ../benchmarks/results:/sentil/benchmarks/results
    command: make bench-prism PRISM=/opt/prism/bin/prism

  sentil-uppaal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    image: ghcr.io/sedislab/sentil-artifact:0.3.0
    volumes:
      - ${UPPAAL_HOME:-.}:/opt/uppaal:ro
      - ../benchmarks/results:/sentil/benchmarks/results
    command: make bench-uppaal VERIFYTA=/opt/uppaal/bin-Linux/verifyta

  sentil-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gpu
    image: ghcr.io/sedislab/sentil-artifact:0.3.0-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]