services:
  sentil-verify:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    image: ghcr.io/sedislab/sentil-artifact:0.3.0

  sentil-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gpu
    image: ghcr.io/sedislab/sentil-artifact:0.3.0-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]