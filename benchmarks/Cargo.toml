[package]
name = "sentil-benchmarks"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
sentil = { path = "../sentil-core" }
serde = { workspace = true }
serde_json = "1.0"
rand = { workspace = true }
rand_distr = { workspace = true }
rand_chacha = { workspace = true }

[features]
gpu = ["sentil/gpu"]

[[bin]]
name = "sentil_runner"
path = "src/bin/sentil_runner.rs"

[[bin]]
name = "sentil_smc_runner"
path = "src/bin/sentil_smc_runner.rs"

[[bin]]
name = "sentil_synth_runner"
path = "src/bin/sentil_synth_runner.rs"

[[bin]]
name = "sentil_particle_runner"
path = "src/bin/sentil_particle_runner.rs"

[[bin]]
name = "sentil_rare_tandem_runner"
path = "src/bin/sentil_rare_tandem_runner.rs"

[[bin]]
name = "sentil_rare_walk_runner"
path = "src/bin/sentil_rare_walk_runner.rs"

[[bin]]
name = "sentil_rare_3tandem_runner"
path = "src/bin/sentil_rare_3tandem_runner.rs"

[[bin]]
name = "sentil_ctmc_runner"
path = "src/bin/sentil_ctmc_runner.rs"

[[bin]]
name = "oracle_export"
path = "src/bin/oracle_export.rs"