[package]
name = "sentil-embedded"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Paapa Kwesi Quansah <paapa_quansah1@baylor.edu>",
    "Ernest Bonnah",
    "SEDIS Lab, Baylor University",
]
repository = "https://github.com/sedislab/SENTIL"
description = "Deterministic STL streaming monitor for microcontrollers, built on the SENTIL core"
publish = false

[lib]
name = "sentil_embedded"
crate-type = ["staticlib", "rlib"]

[features]
default = ["parser"]
# std and specs are host-only: a board has no system allocator to link against.
std = ["sentil/std"]
parser = []
mcu = ["dep:embedded-alloc"]

[dependencies]
sentil = { path = "../../sentil-core", default-features = false }
embedded-alloc = { version = "0.7", optional = true }

[[bin]]
name = "sentil-compile-formula"
path = "src/bin/compile_formula.rs"
required-features = ["std", "parser"]

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1

[workspace]