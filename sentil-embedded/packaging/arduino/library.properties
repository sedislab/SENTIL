name=Sentil
version=1.0.0
author=Paapa Kwesi Quansah, Ernest Bonnah, SEDIS Lab
maintainer=Paapa Kwesi Quansah <paapa_quansah1@baylor.edu>
sentence=Runtime verification with Signal Temporal Logic on a microcontroller.
paragraph=Monitors a stream of sensor readings against a temporal-logic specification, reports the quantitative robustness at every step, and synthesizes and runs a controller on the board, the same engine used in the wider SENTIL toolkit. Statistical model checking and the GPU paths a board cannot host are left out, and the MILP backend with them. The streaming cost is flat per sample with memory proportional to the window, not the trace.
category=Data Processing
url=https://github.com/sedislab/SENTIL
architectures=samd,mbed_rp2040,rp2040,esp32,stm32
includes=Sentil.h
precompiled=true