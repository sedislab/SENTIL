[workspace]
resolver = "2"
members = ["sentil-core", "benchmarks"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Paapa Kwesi Quansah <paapa_quansah1@baylor.edu>",
    "Ernest Bonnah",
    "SEDIS Lab, Baylor University",
]
repository = "https://github.com/sedislab/SENTIL"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
rand = "0.9.2"
rand_distr = "0.5.1"
rand_chacha = "0.9.0"
csv = "1.4"
rayon = "1"
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1
# The C ABI catches a panic at the boundary and returns an error code, which needs
# an unwinder, so this stays even though it restates the default.
panic = "unwind"
strip = true