# Cross-linkers for the Raspberry Pi targets. This is the no-Docker fallback to
# `cross`; install the matching GCC first (gcc-aarch64-linux-gnu and
# gcc-arm-linux-gnueabihf on Debian and Ubuntu). The release workflow uses `cross`,
# which bundles its own toolchain and ignores these. The musl static build goes
# through `cross`, which carries the musl cross toolchain.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"