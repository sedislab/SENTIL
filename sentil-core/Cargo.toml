[package]
name = "sentil"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Runtime verification for Signal Temporal Logic and its probabilistic extension PrSTL"
categories = ["science", "simulation"]
keywords = ["temporal-logic", "runtime-verification", "monitoring", "stl"]

[lib]
name = "sentil"
path = "src/lib.rs"

[[example]]
name = "offline_monitoring"

[[example]]
name = "online_streaming"

[[example]]
name = "probabilistic"
required-features = ["statistical"]

[[example]]
name = "synthesis"
required-features = ["synthesis"]

[features]
default = ["std", "statistical", "ingest", "parallel", "synthesis", "specs", "sqlite"]
std = []
serde = ["std", "dep:serde"]
statistical = ["std", "dep:rand", "dep:rand_distr", "dep:rand_chacha", "dep:libm"]
synthesis = []
parallel = ["statistical", "dep:rayon"]
ingest = ["std", "dep:csv", "dep:matfile"]
specs = ["statistical", "dep:serde", "dep:serde_json", "dep:toml", "dep:serde_yaml", "dep:rust-embed"]
parquet = ["ingest", "dep:parquet", "dep:arrow"]
arrow = ["ingest", "dep:arrow"]
sqlite = ["ingest", "dep:rusqlite"]
hdf5 = ["ingest", "dep:hdf5"]
mcap = ["ingest", "dep:mcap", "dep:serde_json"]
gpu = ["statistical", "dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:futures", "dep:naga"]
synthesis-gpu = ["synthesis", "gpu"]

[dependencies]
thiserror = { version = "2.0", default-features = false }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
libm = { version = "0.2", optional = true }
rand = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1.0.149", optional = true }
toml = { version = "1.1.2", optional = true }
serde_yaml = { version = "0.9.34", optional = true }
rust-embed = { version = "8.0", optional = true }
parquet = { version = "58.1", optional = true, default-features = false, features = ["arrow", "snap"] }
arrow = { version = "58.1", optional = true, default-features = false, features = ["ipc"] }
rusqlite = { version = "0.39", optional = true, features = ["bundled"] }
hdf5 = { version = "0.8.1", optional = true }
matfile = { version = "0.5", optional = true }
mcap = { version = "0.24", optional = true }
wgpu = { version = "27.0", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.24", optional = true, features = ["derive"] }
futures = { version = "0.3.31", optional = true }
naga = { version = "27.0", optional = true, features = ["wgsl-in"] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = "1.0"