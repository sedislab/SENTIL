[package]
name = "sentil"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Runtime verification for Signal Temporal Logic and its probabilistic extension PrSTL"
categories = ["science", "simulation"]
keywords = ["temporal-logic", "runtime-verification", "monitoring", "stl"]

[lib]
name = "sentil"
path = "src/lib.rs"

[[example]]
name = "offline_monitoring"

[[example]]
name = "online_streaming"

[[example]]
name = "probabilistic"
required-features = ["statistical"]

[[example]]
name = "synthesis"
required-features = ["synthesis"]

[features]
default = ["statistical", "ingest", "parallel", "synthesis", "specs"]

# The probabilistic operator: confidence intervals, Monte Carlo, sequential
# testing. Off for a bare STL monitor.
statistical = ["dep:rand", "dep:rand_distr", "dep:rand_chacha"]
# Synthesizing inputs and controllers from a specification, on the CPU with no
# extra dependencies. The MILP and GPU backends sit behind their own features.
synthesis = []

# Spread Monte Carlo across cores with Rayon. Same answer as one thread; each
# sample is seeded independently.
parallel = ["statistical", "dep:rayon"]
# Reading traces from files. CSV and TSV need only this; the columnar and
# database formats add their own features on top.
ingest = ["dep:csv"]

# The premade PrSTL specs: parameterized templates in embedded TOML/YAML/JSON.
# Needs the statistical layer to build their lifting registries.
specs = ["statistical", "dep:serde", "dep:serde_json", "dep:toml", "dep:serde_yaml", "dep:rust-embed"]

[dependencies]
thiserror = { workspace = true }
rand = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1.0.149", optional = true }
toml = { version = "1.1.2", optional = true }
serde_yaml = { version = "0.9.34", optional = true }
rust-embed = { version = "8.0", optional = true }

[dev-dependencies]
proptest = { workspace = true }