[package]
name = "sentil-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The SENTIL command-line tool for monitoring, checking, and synthesizing against STL and PrSTL specifications."

[[bin]]
name = "sentil"
path = "src/main.rs"

[features]
default = []
gpu = ["sentil/gpu", "dep:pollster"]
formats = ["sentil/parquet", "sentil/arrow", "sentil/sqlite"]

[dependencies]
sentil = { path = "../sentil-core", version = "0.3.0", default-features = false, features = [
    "std",
    "statistical",
    "synthesis",
    "specs",
    "ingest",
    "parallel",
    "serde",
] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"
miette = { version = "7.6", features = ["fancy"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
csv = { workspace = true }
anstyle = "1.0"
figment = { version = "0.10", features = ["toml", "env"] }
directories = "5.0"
exitcode = "1.1"
indicatif = "0.18"
inquire = "0.9"
shlex = "1.3"
ctrlc = "3.4"
libc = "0.2"
pollster = { version = "0.3", optional = true }

[build-dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"

[package.metadata.deb]
name = "sentil"
maintainer = "Paapa Kwesi Quansah, Ernest Bonnah, and the SEDIS Lab <paapa_quansah1@baylor.edu>"
copyright = "2025 Paapa Kwesi Quansah, Ernest Bonnah, and the SEDIS Lab"
license-file = ["../LICENSE-MIT", "0"]
extended-description = "Runtime verification for Signal Temporal Logic and its probabilistic extension: monitor a trace or a live stream, run statistical model checking, and synthesize inputs against a specification."
section = "science"
priority = "optional"
assets = [
    ["target/release/sentil", "usr/bin/", "755"],
    ["target/release/build/sentil-cli-*/out/sentil.1", "usr/share/man/man1/", "644"],
    ["target/release/build/sentil-cli-*/out/sentil.bash", "usr/share/bash-completion/completions/sentil", "644"],
    ["target/release/build/sentil-cli-*/out/_sentil", "usr/share/zsh/vendor-completions/_sentil", "644"],
    ["target/release/build/sentil-cli-*/out/sentil.fish", "usr/share/fish/vendor_completions.d/sentil.fish", "644"],
]