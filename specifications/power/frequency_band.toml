[metadata]
name = "Frequency Band"
domain = "power"
description = """
The grid frequency stays inside the IEEE 1547 continuous-operation ride-through region, \
58.8 to 61.2 Hz, for the whole run. Use the normal_band variant for the tighter \
steady-state band."""
references = [
    "IEEE Std 1547-2018, Interconnection and Interoperability of Distributed Energy Resources, Clause 6.5.2.2 and Table 19 (continuous-operation frequency ride-through region 58.8-61.2 Hz); Table 4 (enter-service frequency range)",
    "Detection of Smart Grid Integrity Attacks Using Signal Temporal Logic, arXiv:2209.06722, 2022",
]

[variables]
frequency = { unit = "Hz", description = "Measured grid frequency" }

[parameters]
T     = { type = "float", default = 60.0, unit = "seconds", description = "Observation horizon" }
f_min = { type = "float", default = 58.8, unit = "Hz", description = "Lower edge of the continuous-operation ride-through region" }
f_max = { type = "float", default = 61.2, unit = "Hz", description = "Upper edge of the continuous-operation ride-through region" }
p     = { type = "float", default = 0.99, range = [0.0, 1.0], description = "PrSTL probability threshold (high, a stability property)" }

[formulas]
deterministic = "always[0, {T}](frequency > {f_min} and frequency < {f_max})"
probabilistic = "P >= {p}(always[0, {T}](frequency > {f_min} and frequency < {f_max}))"

[noise]
frequency = { model = "Gaussian", mean = 0.0, std_dev = 0.01, interaction = "additive" }

[noise_fit]
frequency = { algorithm = "fit_gaussian", interaction = "additive" }

[verification.smc]
confidence = 0.99
sample_budget = 2000

[verification.sprt]
p0 = 0.95
p1 = 0.99
alpha = 0.01
beta = 0.01
max_samples = 10000

[verification.ams]
num_particles = 1000
max_steps = 10000

[variants.normal_band]
description = "The tighter 59.5 to 60.5 Hz normal/steady-state band rather than the 1547 ride-through region."
parameters.f_min.default = 59.5
parameters.f_max.default = 60.5