[metadata]
name = "Speed Limit"
domain = "automotive"
description = """
The speed stays at or below the applicable limit. The 33.3 m/s (120 km/h) default is a \
highway placeholder; set it per segment, or compare against a posted-limit signal \
rather than a constant where the limit varies along the route."""
references = [
    "ISO 26262-4:2018, Road vehicles - Functional safety - Part 4, Clause 6.4.1 (technical safety requirements specify the stimulus-response behavior; other applicable rules may apply)",
]

[variables]
speed = { unit = "m/s", description = "Vehicle longitudinal ground speed" }

[parameters]
T           = { type = "float", default = 30.0, unit = "seconds", description = "Observation horizon" }
speed_limit = { type = "float", default = 33.3, unit = "m/s", description = "Applicable speed limit for the segment (set per route)" }
p           = { type = "float", default = 0.95, range = [0.0, 1.0], description = "PrSTL probability threshold" }

[formulas]
deterministic = "always[0, {T}](speed <= {speed_limit})"
probabilistic = "P >= {p}(always[0, {T}](speed <= {speed_limit}))"

[noise]
speed = { model = "Gaussian", mean = 0.0, std_dev = 0.2, interaction = "additive" }

[noise_fit]
speed = { algorithm = "fit_gaussian", interaction = "additive" }

[verification.smc]
confidence = 0.95
sample_budget = 1000

[verification.sprt]
p0 = 0.90
p1 = 0.95
alpha = 0.05
beta = 0.05
max_samples = 5000

[verification.ams]
num_particles = 1000
max_steps = 10000