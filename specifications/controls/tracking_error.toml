# The output must track a time-varying reference signal within a bounded
# error envelope at every instant, including during transients. This is
# the trajectory-tracking analog of steady-state error: it applies to the
# entire trajectory, not just the post-transient regime.
#
# Common in robotic path following, CNC machining, and any application
# where the setpoint is not a static step but a continuous profile.
 
[metadata]
name = "Tracking Error"
domain = "controls"
description = """
The output follows a time-varying reference within a bounded error at \
every instant. Unlike steady-state error, this applies during transients \
too. Typical use: robotic path following, CNC contour tracking."""
references = [
    "Siciliano, Sciavicco, Villani & Oriolo, Robotics: Modelling, Planning and Control, Ch. 8 (Motion Control; trajectory-tracking error e = q_d - q)",
    "Astrom & Murray, Feedback Systems, 2nd ed., Ch. 7",
]
 
[variables]
output    = { description = "Measured plant output" }
reference = { description = "Time-varying reference trajectory" }
 
[parameters]
T       = { type = "float", default = 30.0, unit = "seconds", description = "Observation horizon" }
epsilon = { type = "float", default = 0.1,  description = "Maximum allowable tracking error" }
p       = { type = "float", default = 0.95, range = [0.0, 1.0], description = "PrSTL probability threshold" }
 
[formulas]
deterministic = "always[0, {T}](abs(output - reference) < {epsilon})"
probabilistic = "P >= {p}(always[0, {T}](abs(output - reference) < {epsilon}))"
 
[noise]
output    = { model = "Gaussian", mean = 0.0, std_dev = 0.02, interaction = "additive" }
reference = { model = "Gaussian", mean = 0.0, std_dev = 0.01, interaction = "additive" }
 
[noise_fit]
output    = { algorithm = "fit_gmm", k = 2, max_iters = 100, interaction = "additive" }
reference = { algorithm = "fit_gaussian", interaction = "additive" }
 
[verification.smc]
confidence = 0.95
sample_budget = 1000
 
[verification.sprt]
p0 = 0.90
p1 = 0.95
alpha = 0.05
beta = 0.05
max_samples = 5000
 
[verification.ams]
num_particles = 1000
max_steps = 10000