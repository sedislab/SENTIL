[metadata]
name = "Gain Margin Proxy"
domain = "controls"
description = """
Under multiplicative gain perturbation, the output remains bounded. A \
time-domain proxy for classical gain margin. Uses multiplicative noise \
to model plant gain uncertainty across Monte Carlo traces."""
references = [
    "Zhou, Doyle & Glover, Robust and Optimal Control, Sec. 9.5 (gain margin and phase margin, and why they are not sufficient robustness indicators)",
    "Doyle, Francis & Tannenbaum, Feedback Control Theory, Ch. 11 (stability margin optimization)",
]

[variables]
output = { description = "Measured plant output under gain-perturbed conditions" }

[parameters]
T     = { type = "float", default = 30.0, unit = "seconds", description = "Observation horizon" }
bound = { type = "float", default = 2.0,  description = "Output magnitude bound (if exceeded, the system is effectively unstable)" }
p     = { type = "float", default = 0.95, range = [0.0, 1.0], description = "PrSTL probability threshold" }

[formulas]
deterministic = "always[0, {T}](abs(output) < {bound})"
probabilistic = "P >= {p}(always[0, {T}](abs(output) < {bound}))"

[noise]
output = { model = "Gaussian", mean = 1.0, std_dev = 0.1, interaction = "multiplicative" }

[noise_fit]
output = { algorithm = "fit_gmm", k = 2, max_iters = 100, interaction = "multiplicative" }

[verification.smc]
confidence = 0.95
sample_budget = 2000

[verification.sprt]
p0 = 0.90
p1 = 0.95
alpha = 0.05
beta = 0.05
max_samples = 5000

[verification.ams]
num_particles = 1000
max_steps = 10000