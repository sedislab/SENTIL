[metadata]
name = "Delay Margin Proxy"
domain = "controls"
description = """
Under injected time delay, the output remains bounded. A time-domain \
proxy for classical delay margin. Run your simulator with varying delays, \
export traces, and check each against this spec."""
references = [
    "Sipahi, Niculescu, Gu, Michiels & Chen, Stability and Stabilization of Systems with Time Delay, 2011",
    "Astrom & Murray, Feedback Systems, 2nd ed., Ch. 10",
]

[variables]
output = { description = "Measured plant output under delay-perturbed conditions" }

[parameters]
T     = { type = "float", default = 30.0, unit = "seconds", description = "Observation horizon" }
bound = { type = "float", default = 2.0,  description = "Output magnitude bound" }
delay = { type = "float", default = 0.1,  unit = "seconds", description = "Injected loop delay (documentation only; does not affect the formula)" }
p     = { type = "float", default = 0.95, range = [0.0, 1.0], description = "PrSTL probability threshold" }

[formulas]
deterministic = "always[0, {T}](abs(output) < {bound})"
probabilistic = "P >= {p}(always[0, {T}](abs(output) < {bound}))"

[noise]
output = { model = "Gaussian", mean = 0.0, std_dev = 0.05, interaction = "additive" }

[noise_fit]
output = { algorithm = "fit_gaussian", interaction = "additive" }

[verification.smc]
confidence = 0.95
sample_budget = 1000

[verification.sprt]
p0 = 0.90
p1 = 0.95
alpha = 0.05
beta = 0.05
max_samples = 5000

[verification.ams]
num_particles = 1000
max_steps = 10000