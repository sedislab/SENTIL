# After a step change in the reference, the output must not exceed the
# setpoint by more than a fraction of the step size. This is the single
# most commonly specified transient requirement in classical control design.
# For a standard second-order system, percentage overshoot maps directly
# to the damping ratio via M_p = exp(-pi*zeta / sqrt(1 - zeta^2)).
 
[metadata]
name = "Overshoot"
domain = "controls"
description = """
The system output does not exceed the reference by more than a specified \
fraction of the step amplitude. A 5% overshoot limit corresponds roughly \
to a damping ratio of 0.69 for a second-order system."""
references = [
    "Ogata, Modern Control Engineering, 5th ed., Ch. 5",
    "Dorf & Bishop, Modern Control Systems, 13th ed., Ch. 5",
]
 
[variables]
output = { description = "Measured plant output" }
reference = { description = "Step setpoint value" }
 
[parameters]
max_overshoot  = { type = "float", default = 0.05,  range = [0.0, 1.0], description = "Allowable overshoot as a fraction of step amplitude (0.05 = 5%)" }
step_amplitude = { type = "float", default = 1.0,   description = "Size of the step input" }
T              = { type = "float", default = 30.0,   unit = "seconds", description = "Observation horizon" }
reference      = { type = "float", default = 1.0,   description = "Final setpoint after the step" }
p              = { type = "float", default = 0.95,   range = [0.0, 1.0], description = "PrSTL probability threshold" }
 
[formulas]
deterministic = "always[0, {T}](output - reference < {max_overshoot} * {step_amplitude})"
probabilistic = "P >= {p}(always[0, {T}](output - reference < {max_overshoot} * {step_amplitude}))"
 
[noise]
output = { model = "Gaussian", mean = 0.0, std_dev = 0.01, interaction = "additive" }
 
[noise_fit]
output = { algorithm = "fit_gmm", k = 2, max_iters = 100, interaction = "additive" }
 
[verification.smc]
confidence = 0.95
sample_budget = 1000
 
[verification.sprt]
p0 = 0.90
p1 = 0.95
alpha = 0.05
beta = 0.05
max_samples = 5000
 
[verification.ams]
num_particles = 1000
max_steps = 10000
 
[variants.step_up]
description = "Default. Output overshoots above the reference."
 
[variants.step_down]
description = "Step-down transient. Checks undershoot below the new (lower) reference."
formulas.deterministic = "always[0, {T}](reference - output < {max_overshoot} * {step_amplitude})"
formulas.probabilistic = "P >= {p}(always[0, {T}](reference - output < {max_overshoot} * {step_amplitude}))"
 
[variants.bidirectional]
description = "Checks both overshoot and undershoot symmetrically."
formulas.deterministic = "always[0, {T}](abs(output - reference) < {max_overshoot} * {step_amplitude})"
formulas.probabilistic = "P >= {p}(always[0, {T}](abs(output - reference) < {max_overshoot} * {step_amplitude}))"