[metadata]
name = "Temperature Limit"
domain = "industrial"
description = "The process temperature stays below its safe limit for the whole run."
references = [
    "IEC 61511-2:2003, Safety instrumented systems for the process industry sector, Part 2, Clause 10.3.1 a) (a safety instrumented function holds a process variable within safe limits; the action value sits outside the normal range and below the hazardous value). The numeric limit is plant specific",
    "V. Raman, A. Donze, M. Maasoumy, R. M. Murray, A. Sangiovanni-Vincentelli, S. A. Seshia, Model Predictive Control with Signal Temporal Logic Specifications, IEEE CDC 2014, pp. 81-87",
]

[variables]
temperature = { unit = "C", description = "Measured process temperature" }

[parameters]
T     = { type = "float", default = 60.0, unit = "seconds", description = "Observation horizon" }
t_max = { type = "float", default = 40.0, unit = "C", description = "Maximum safe temperature" }
p     = { type = "float", default = 0.99, range = [0.0, 1.0], description = "PrSTL probability threshold (high, a safety property)" }

[formulas]
deterministic = "always[0, {T}](temperature < {t_max})"
probabilistic = "P >= {p}(always[0, {T}](temperature < {t_max}))"

[noise]
temperature = { model = "Gaussian", mean = 0.0, std_dev = 0.1, interaction = "additive" }

[noise_fit]
temperature = { algorithm = "fit_gaussian", interaction = "additive" }

[verification.smc]
confidence = 0.99
sample_budget = 2000

[verification.sprt]
p0 = 0.95
p1 = 0.99
alpha = 0.01
beta = 0.01
max_samples = 10000

[verification.ams]
num_particles = 1000
max_steps = 10000