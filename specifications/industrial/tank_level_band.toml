[metadata]
name = "Tank Level Band"
domain = "industrial"
description = "The tank level stays between its low and high marks for the whole run."
references = [
    "ANSI/ISA-18.2-2016 (IEC 62682), Management of Alarm Systems for the Process Industries, Clause 10.5.3 (alarm setpoints) and Clause 3.1.1 (absolute alarms: high, high-high, low, low-low). The low and high marks are plant specific",
    "V. Raman, A. Donze, M. Maasoumy, R. M. Murray, A. Sangiovanni-Vincentelli, S. A. Seshia, Model Predictive Control with Signal Temporal Logic Specifications, IEEE CDC 2014, pp. 81-87",
]

[variables]
level = { description = "Measured tank level as a fraction of capacity" }

[parameters]
T         = { type = "float", default = 60.0, unit = "seconds", description = "Observation horizon" }
level_min = { type = "float", default = 0.2, description = "Low mark" }
level_max = { type = "float", default = 0.9, description = "High mark" }
p         = { type = "float", default = 0.95, range = [0.0, 1.0], description = "PrSTL probability threshold" }

[formulas]
deterministic = "always[0, {T}](level > {level_min} and level < {level_max})"
probabilistic = "P >= {p}(always[0, {T}](level > {level_min} and level < {level_max}))"

[noise]
level = { model = "Gaussian", mean = 0.0, std_dev = 0.01, interaction = "additive" }

[noise_fit]
level = { algorithm = "fit_gaussian", interaction = "additive" }

[verification.smc]
confidence = 0.95
sample_budget = 1000

[verification.sprt]
p0 = 0.90
p1 = 0.95
alpha = 0.05
beta = 0.05
max_samples = 5000

[verification.ams]
num_particles = 1000
max_steps = 10000