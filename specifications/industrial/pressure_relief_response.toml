[metadata]
name = "Pressure Relief Response"
domain = "industrial"
description = "Whenever pressure exceeds the trip point, the relief valve opens within the reaction time."
references = [
    "IEC 61511-2:2003, Safety instrumented systems for the process industry sector, Part 2, Clause 3.2.71 (a SIF closes a valve within a set time when pressure reaches a setpoint) and Clause 10.3.1. The setpoint and deadline are plant specific and must be below the process safety time",
    "V. Raman, A. Donze, M. Maasoumy, R. M. Murray, A. Sangiovanni-Vincentelli, S. A. Seshia, Model Predictive Control with Signal Temporal Logic Specifications, IEEE CDC 2014, pp. 81-87",
]

[variables]
pressure    = { unit = "bar", description = "Measured vessel pressure" }
relief_open = { description = "Relief valve position; above 0.5 means open" }

[parameters]
T       = { type = "float", default = 60.0, unit = "seconds", description = "Observation horizon" }
p_trip  = { type = "float", default = 20.0, unit = "bar", description = "Pressure trip point" }
t_react = { type = "float", default = 10.0, unit = "seconds", description = "Deadline for the valve to open" }
p       = { type = "float", default = 0.99, range = [0.0, 1.0], description = "PrSTL probability threshold (high, a safety property)" }

[formulas]
deterministic = "always[0, {T}]((pressure > {p_trip}) implies eventually[0, {t_react}](relief_open > 0.5))"
probabilistic = "P >= {p}(always[0, {T}]((pressure > {p_trip}) implies eventually[0, {t_react}](relief_open > 0.5)))"

[noise]
pressure = { model = "Gaussian", mean = 0.0, std_dev = 0.1, interaction = "additive" }

[noise_fit]
pressure = { algorithm = "fit_gaussian", interaction = "additive" }

[verification.smc]
confidence = 0.99
sample_budget = 2000

[verification.sprt]
p0 = 0.95
p1 = 0.99
alpha = 0.01
beta = 0.01
max_samples = 10000

[verification.ams]
num_particles = 1000
max_steps = 10000