[metadata]
name = "Latency Bound"
domain = "networking"
description = "The one-way packet delay stays below the agreed bound for the whole window."
references = [
    "RFC 7679, A One-Way Delay Metric for IP Performance Metrics (IPPM)",
    "ITU-T Y.1541, Network performance objectives for IP-based services (for the numeric bound)",
]

[variables]
one_way_delay = { unit = "seconds", description = "Measured one-way packet delay" }

[parameters]
T         = { type = "float", default = 60.0, unit = "seconds", description = "Observation window" }
max_delay = { type = "float", default = 0.1,  unit = "seconds", description = "Maximum allowed one-way delay" }
p         = { type = "float", default = 0.95, range = [0.0, 1.0], description = "PrSTL probability threshold" }

[formulas]
deterministic = "always[0, {T}](one_way_delay < {max_delay})"
probabilistic = "P >= {p}(always[0, {T}](one_way_delay < {max_delay}))"

[noise]
one_way_delay = { model = "Gaussian", mean = 0.0, std_dev = 0.002, interaction = "additive" }

[noise_fit]
one_way_delay = { algorithm = "fit_gaussian", interaction = "additive" }

[verification.smc]
confidence = 0.95
sample_budget = 1000

[verification.sprt]
p0 = 0.90
p1 = 0.95
alpha = 0.05
beta = 0.05
max_samples = 5000

[verification.ams]
num_particles = 1000
max_steps = 10000