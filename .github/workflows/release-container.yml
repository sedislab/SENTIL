name: release-container

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sentil-artifact

jobs:
  publish:
    name: publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: base, suffix: '' }
          - { target: gpu, suffix: '-gpu' }
    steps:
      - uses: actions/checkout@v4

      - name: resolve the version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}${{ matrix.suffix }}
            ${{ env.IMAGE }}:latest${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.title=SENTIL artifact
            org.opencontainers.image.description=Runtime verification and controller synthesis for Probabilistic Signal Temporal Logic, with the benchmark corpus and the claim verification tier.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  verify:
    name: verify the published ${{ matrix.target }} image
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: base, suffix: '' }
          - { target: gpu, suffix: '-gpu' }
    steps:
      - uses: actions/checkout@v4

      - name: resolve the version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull and run
        run: |
          docker pull "${IMAGE}:${VERSION}${SUFFIX}"
          docker run --rm "${IMAGE}:${VERSION}${SUFFIX}"
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.version.outputs.value }}
          SUFFIX: ${{ matrix.suffix }}