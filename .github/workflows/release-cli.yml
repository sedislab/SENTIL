name: release-cli

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      submit:
        description: open the winget pull request
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bundle:
    name: bundle ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, triple: x86_64-unknown-linux-gnu, fmt: tar.gz }
          - { os: macos-15-intel, name: macos-x86_64, triple: x86_64-apple-darwin, fmt: tar.gz }
          - { os: macos-14, name: macos-arm64, triple: aarch64-apple-darwin, fmt: tar.gz }
          - { os: windows-latest, name: windows-x86_64, triple: x86_64-pc-windows-msvc, fmt: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - run: cargo build --release -p sentil-cli --target ${{ matrix.triple }}
      - name: stage archive
        shell: bash
        run: |
          ext=""
          [ "${{ matrix.triple }}" = "x86_64-pc-windows-msvc" ] && ext=".exe"
          bin="target/${{ matrix.triple }}/release/sentil${ext}"
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$version" ] && version="0.3.0"
          packaging/cli/stage.sh "${{ matrix.triple }}" "$version" "$bin" "${{ matrix.fmt }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sentil-${{ matrix.name }}
          path: assets/**

  release:
    name: attach to the release
    needs: bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_EVENT_TOKEN || github.token }}
          draft: true
          files: assets/**/*

  publish-homebrew:
    name: push the homebrew formula
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets }
      - name: make the tap public if it is private
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then exit 0; fi
          priv=$(gh api repos/sedislab/homebrew-sentil --jq .private 2>/dev/null || echo "")
          if [ "$priv" = "true" ]; then gh api -X PATCH repos/sedislab/homebrew-sentil -f visibility=public; fi
      - name: fill and push to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "no HOMEBREW_TAP_TOKEN; skipping"; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$version" ] && version="0.3.0"
          packaging/cli/fill-manifests.sh "$version" assets staged
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/sedislab/homebrew-sentil.git" tap
          mkdir -p tap/Formula
          cp staged/sentil.rb tap/Formula/sentil.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sentil.rb
          git commit -m "sentil ${version}" && git push || echo "nothing to push"

  publish-scoop:
    name: push the scoop manifest
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets }
      - name: make the bucket public if it is private
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then exit 0; fi
          priv=$(gh api repos/sedislab/scoop-sentil --jq .private 2>/dev/null || echo "")
          if [ "$priv" = "true" ]; then gh api -X PATCH repos/sedislab/scoop-sentil -f visibility=public; fi
      - name: fill and push to the bucket
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$BUCKET_TOKEN" ]; then echo "no SCOOP_BUCKET_TOKEN; skipping"; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$version" ] && version="0.3.0"
          packaging/cli/fill-manifests.sh "$version" assets staged
          git clone --depth 1 "https://x-access-token:${BUCKET_TOKEN}@github.com/sedislab/scoop-sentil.git" bucket
          mkdir -p bucket/bucket
          cp staged/sentil.json bucket/bucket/sentil.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/sentil.json
          git commit -m "sentil ${version}" && git push || echo "nothing to push"

  stage-winget:
    name: stage the winget manifests
    needs: bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.submit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets }
      - name: fill the manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$version" ] && version="0.3.0"
          packaging/cli/fill-manifests.sh "$version" assets winget-staged
          rm -f winget-staged/sentil.rb winget-staged/sentil.json
      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: winget-staged/**

      - name: open the winget pull request
        if: startsWith(github.ref, 'refs/tags/') || inputs.submit
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "no REGISTRY_PR_TOKEN; the manifests stay staged as an artifact"; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          gh repo fork microsoft/winget-pkgs --clone=false
          owner=$(gh api user --jq .login)
          for _ in $(seq 1 30); do
            gh api "repos/${owner}/winget-pkgs" >/dev/null 2>&1 && break
            sleep 10
          done
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${GH_TOKEN}@github.com/${owner}/winget-pkgs.git" fork
          cd fork
          git sparse-checkout set manifests/s/SEDIS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "sentil-${version}"
          mkdir -p "manifests/s/SEDIS/SENTIL/${version}"
          cp ../winget-staged/*.yaml "manifests/s/SEDIS/SENTIL/${version}/"
          git add -A && git commit -m "New version: SEDIS.SENTIL version ${version}"
          git push -u origin "sentil-${version}"
          gh pr create --repo microsoft/winget-pkgs \
            --head "${owner}:sentil-${version}" --base master \
            --title "New version: SEDIS.SENTIL version ${version}" \
            --body "Adds SEDIS.SENTIL at ${version}. SENTIL is a tool for runtime verification of Signal Temporal Logic and its probabilistic extension, PrSTL."