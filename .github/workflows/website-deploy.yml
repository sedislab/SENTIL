name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: install with scripts blocked
        run: npm ci --ignore-scripts
      - name: generate the mdx collections
        run: npx fumadocs-mdx
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
      - name: typecheck
        run: npm run types:check
      - name: guard the output
        working-directory: website/out
        run: |
          if grep -rIil --exclude-dir=pyodide \
              -e chatgpt -e openai -e anthropic -e claude -e copilot \
              -e 'Open in Cursor' -e 'Open in Scira' .; then
            echo "an assistant reference reached the build output"; exit 1
          fi
          if grep -rIl -e pquansah -e /projects/beph .; then
            echo "a build path reached the output"; exit 1
          fi
          if strings engine/sentil_engine_bg.wasm | grep -q pquansah; then
            echo "a build path reached the wasm"; exit 1
          fi
          if find . -name '*.map' | grep -q .; then
            echo "a source map shipped"; exit 1
          fi
          echo "output guard passed"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: website/out
          retention-days: 3

  deploy:
    name: deploy to cloudflare pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    environment:
      name: website
      url: https://sentil.pages.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: create the project if it is not there yet
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create sentil --production-branch=main
      - name: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=sentil --branch=main