name: ci-embedded

on:
  push:
  pull_request:

jobs:
  host-test:
    name: host oracle test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        working-directory: sentil-embedded/rust
        run: cargo clippy --features std -- -D warnings
      - name: rust abi tests
        run: make -C sentil-embedded test-rust
      - name: host tests
        run: make -C sentil-embedded test
      - name: leak check
        run: sudo apt-get update && sudo apt-get install -y valgrind && make -C sentil-embedded leakcheck

  miri:
    name: miri aliasing check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: miri abi tests
        working-directory: sentil-embedded/rust
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo miri test --features std

  cross-compile:
    name: board ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv6m-none-eabi
          - thumbv7m-none-eabi
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: add the board target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - name: archive with the parser
        working-directory: sentil-embedded/rust
        run: cargo build --release --features mcu --target ${{ matrix.target }}
      - name: archive without the parser
        working-directory: sentil-embedded/rust
        run: cargo build --release --no-default-features --features mcu --target ${{ matrix.target }}