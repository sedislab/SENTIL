name: release-julia-artifacts

on:
  workflow_dispatch:
    inputs:
      prepare:
        description: attach the tarballs to the draft release and commit the filled hashes
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: julia artifact ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, container: quay.io/pypa/manylinux_2_28_x86_64, triple: x86_64-linux-gnu, target: x86_64-unknown-linux-gnu, lib: libsentil.so }
          - { os: ubuntu-24.04-arm, container: quay.io/pypa/manylinux_2_28_aarch64, triple: aarch64-linux-gnu, target: aarch64-unknown-linux-gnu, lib: libsentil.so }
          - { os: macos-15-intel, triple: x86_64-apple-darwin, target: x86_64-apple-darwin, lib: libsentil.dylib }
          - { os: macos-14, triple: aarch64-apple-darwin, target: aarch64-apple-darwin, lib: libsentil.dylib }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, target: x86_64-pc-windows-msvc, lib: sentil.dll }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: build the core
        run: cargo build --release -p sentil-ffi --target ${{ matrix.target }}

      - name: stage the tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$version" ] && version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" stage/
          tar czf "sentil-${version}-${{ matrix.triple }}-julia.tar.gz" -C stage .
          echo "version=$version" >> "$GITHUB_ENV"

      - if: runner.os == 'Linux'
        run: packaging/check-glibc.sh stage

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: hash it the way Pkg will
        shell: bash
        run: |
          set -euo pipefail
          tarball="sentil-${version}-${{ matrix.triple }}-julia.tar.gz"
          julia --color=no -e '
            using Pkg, SHA
            tarball = ARGS[1]
            dir = mktempdir()
            run(`tar xzf $tarball -C $dir`)
            tree = bytes2hex(Pkg.GitTools.tree_hash(dir))
            sha  = open(tarball, "r") do io; bytes2hex(sha256(io)); end
            write("hashes-" * ARGS[2] * ".txt", "tree=$tree\nsha256=$sha\n")
          ' "$tarball" "${{ matrix.triple }}"

      - uses: actions/upload-artifact@v4
        with:
          name: julia-${{ matrix.triple }}
          path: |
            sentil-*-julia.tar.gz
            hashes-*.txt

  assemble:
    name: fill Artifacts.toml
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true

      - name: rewrite the placeholders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import pathlib, re

          triples = {
              'x86_64-linux-gnu': None, 'aarch64-linux-gnu': None,
              'x86_64-apple-darwin': None, 'aarch64-apple-darwin': None,
              'x86_64-pc-windows-msvc': None,
          }
          for t in triples:
              f = pathlib.Path('incoming') / f'hashes-{t}.txt'
              if not f.exists():
                  raise SystemExit(f'missing hashes for {t}')
              kv = dict(l.split('=', 1) for l in f.read_text().split())
              triples[t] = (kv['tree'], kv['sha256'])

          path = pathlib.Path('sentil-jl/Artifacts.toml')
          text = path.read_text()
          blocks = text.split('[[libsentil]]')
          out = [blocks[0]]
          for b in blocks[1:]:
              m = re.search(r'sentil-[\d.]+-(?P<t>[a-z0-9_\-]+)-julia\.tar\.gz', b)
              if not m or m.group('t') not in triples:
                  raise SystemExit(f'no triple in block:\n{b[:200]}')
              tree, sha = triples[m.group('t')]
              b = re.sub(r'git-tree-sha1 = "[0-9a-f]+"', f'git-tree-sha1 = "{tree}"', b)
              b = re.sub(r'sha256 = "[0-9a-f]+"', f'sha256 = "{sha}"', b)
              out.append(b)
          text = '[[libsentil]]'.join(out)
          if '0000000000' in text:
              raise SystemExit('a placeholder survived the rewrite')
          path.write_text(text)
          EOF
          echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - run: git --no-pager diff -- sentil-jl/Artifacts.toml

      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts.toml
          path: sentil-jl/Artifacts.toml

      - name: commit the filled hashes
        if: inputs.prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "v${version}" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "v${version} is already published, so its tarballs stay as they are"; exit 1
          fi
          git config user.name "Paapa Quansah"
          git config user.email "officialpaapa@gmail.com"
          git add sentil-jl/Artifacts.toml
          git diff --cached --quiet && exit 0
          git commit -m "julia artifact hashes for v${version}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: attach the tarballs to the draft release
        if: inputs.prepare
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_EVENT_TOKEN || github.token }}
          tag_name: v${{ env.version }}
          draft: true
          files: incoming/sentil-*-julia.tar.gz