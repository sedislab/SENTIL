name: ci-julia

on:
  push:
  pull_request:

jobs:
  test:
    name: julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the core
        run: cargo build --release -p sentil-ffi
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: run the tests
        env:
          SENTIL_LIB: ${{ github.workspace }}/target/release/libsentil.so
        run: julia --project=sentil-jl -e 'using Pkg; Pkg.test()'

  artifact:
    name: load from the published artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: load the way a registry user does, with no local build
        run: |
          julia --project=sentil-jl -e '
            using Pkg, TOML
            Pkg.instantiate()
            using Sentil
            want = VersionNumber(TOML.parsefile("sentil-jl/Project.toml")["version"])
            got = Sentil.version()
            got == (want.major, want.minor, want.patch) ||
                error("the artifact reports $got but Project.toml declares $want")
            println("loaded from the artifact, version ", got)'