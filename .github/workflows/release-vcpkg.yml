name: release-vcpkg

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      submit:
        description: open the pull request
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stage:
    name: stage and validate the vcpkg port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: resolve the version
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$version" ] && version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.ver.outputs.version }}"
          mkdir -p assets
          for plat in linux-x86_64 macos-x86_64 macos-arm64 windows-x86_64; do
            gh release download "v${version}" \
              --repo sedislab/SENTIL \
              --pattern "sentil-${version}-${plat}.tar.gz" \
              --dir assets
          done

      - name: refresh the portfile hashes
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"

          curl -fsSL -o assets/source.tar.gz \
            "https://github.com/sedislab/SENTIL/archive/v${version}.tar.gz"

          sha512() { sha512sum "$1" | awk '{print $1}'; }

          python3 scripts/refresh_vcpkg_hashes.py \
            packaging/vcpkg/ports/sentil/portfile.cmake \
            "$(sha512 assets/source.tar.gz)" \
            "$(sha512 "assets/sentil-${version}-linux-x86_64.tar.gz")" \
            "$(sha512 "assets/sentil-${version}-macos-arm64.tar.gz")" \
            "$(sha512 "assets/sentil-${version}-macos-x86_64.tar.gz")" \
            "$(sha512 "assets/sentil-${version}-windows-x86_64.tar.gz")"

      - name: get vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: validate the port builds
        run: |
          ./vcpkg/vcpkg install sentil \
            --overlay-ports=packaging/vcpkg/ports \
            --triplet x64-linux --enforce-port-checks

      - name: stage the port for the registry PR
        run: |
          mkdir -p staged/ports
          cp -r packaging/vcpkg/ports/sentil staged/ports/sentil

      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-port
          path: staged/ports/**

      - name: open or update the vcpkg pull request
        if: startsWith(github.ref, 'refs/tags/') || inputs.submit
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "no REGISTRY_PR_TOKEN; the port stays staged as an artifact"; exit 0; fi
          version="${{ steps.ver.outputs.version }}"
          branch="sentil-${version}"
          gh repo fork microsoft/vcpkg --clone=false
          owner=$(gh api user --jq .login)
          for _ in $(seq 1 30); do
            gh api "repos/${owner}/vcpkg" >/dev/null 2>&1 && break
            sleep 10
          done
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${owner}/vcpkg.git" fork
          cd fork
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git checkout -B "$branch" "origin/${branch}"
          else
            git checkout -B "$branch"
          fi
          mkdir -p ports/sentil
          cp -r ../staged/ports/sentil/. ports/sentil/
          ./bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg format-manifest ports/sentil/vcpkg.json
          git add ports/sentil
          git diff --cached --quiet || git commit -m "[sentil] add new port ${version}"
          ./vcpkg x-add-version sentil --overwrite-version
          git add versions
          git diff --cached --quiet || git commit -m "[sentil] record ${version} in the version database"
          git push origin "$branch"
          open=$(gh api "repos/microsoft/vcpkg/pulls?head=${owner}:${branch}&state=open" --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "pushed to the open pull request for ${branch}"
            exit 0
          fi
          gh pr create --repo microsoft/vcpkg \
            --head "${owner}:${branch}" --base master \
            --title "[sentil] add new port ${version}" \
            --body "Adds the \`sentil\` port at ${version}. And regarding the question from the previous submission, this is consumed as a C and C++ library. This port has a C-ABI header over a Rust core and it's used as any regular C or C++ library."