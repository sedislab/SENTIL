name: release-julia

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  tagbot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, 'TagBot trigger')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: sentil-jl