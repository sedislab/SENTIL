name: release-matlab

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gateway:
    name: gateway on ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-14
            artifact: macos
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.MLM_LICENSE_TOKEN != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.MLM_LICENSE_TOKEN != ''
      - name: build the core
        if: env.MLM_LICENSE_TOKEN != ''
        run: cargo build --release -p sentil-ffi
      - uses: actions/setup-java@v5
        if: env.MLM_LICENSE_TOKEN != '' && matrix.artifact == 'macos'
        with:
          distribution: temurin
          java-version: '17'
      - name: mingw for mex
        if: env.MLM_LICENSE_TOKEN != '' && matrix.artifact == 'windows'
        run: |
          C:\msys64\usr\bin\pacman -S --noconfirm --needed mingw-w64-x86_64-gcc
          echo "MW_MINGW64_LOC=C:\msys64\mingw64" >> $env:GITHUB_ENV
      - uses: matlab-actions/setup-matlab@v2
        if: env.MLM_LICENSE_TOKEN != ''
        with:
          release: R2023b
          products: Simulink
      - name: build and check the gateway
        if: env.MLM_LICENSE_TOKEN != ''
        uses: matlab-actions/run-command@v2
        with:
          command: cd('sentil-matlab'); build_sentil; addpath(pwd); assertSuccess(runtests('tests'))
      - name: collect this platform's gateway
        if: env.MLM_LICENSE_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.artifact }}
          path: |
            sentil-matlab/+sentil/private/*.mex*
            sentil-matlab/+sentil/private/libsentil.*
            sentil-matlab/+sentil/private/sentil.dll
            sentil-matlab/blocks/*.mex*
            sentil-matlab/blocks/libsentil.*
            sentil-matlab/blocks/sentil.dll
          if-no-files-found: error

  package:
    name: package mltbx
    needs: gateway
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.MLM_LICENSE_TOKEN != ''
      - name: gather every platform's gateway
        if: env.MLM_LICENSE_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: gateway-*
          merge-multiple: true
          path: sentil-matlab
      - uses: matlab-actions/setup-matlab@v2
        if: env.MLM_LICENSE_TOKEN != ''
        with:
          release: R2023b
      - name: package the toolbox
        if: env.MLM_LICENSE_TOKEN != ''
        uses: matlab-actions/run-command@v2
        with:
          command: cd('sentil-matlab'); package_sentil('Sentil.mltbx')
      - name: attach the package to the release
        if: env.MLM_LICENSE_TOKEN != '' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_EVENT_TOKEN || github.token }}
          files: sentil-matlab/Sentil.mltbx