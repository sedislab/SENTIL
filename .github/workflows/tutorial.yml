name: tutorial

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'tutorial/**'
      - 'benchmarks/results/*.png'
      - '.github/workflows/tutorial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: compile the tutorial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stage the benchmark figures
        run: sh tutorial/sync-figures.sh
      - name: compile to pdf
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: tutorial
          root_file: sentil-tutorial.tex
          latexmk_use_xelatex: true
      - uses: actions/upload-artifact@v4
        with:
          name: sentil-tutorial
          path: tutorial/sentil-tutorial.pdf
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_EVENT_TOKEN || github.token }}
          draft: true
          files: tutorial/sentil-tutorial.pdf