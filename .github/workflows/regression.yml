name: regression

on:
  push:
  pull_request:

jobs:
  claims:
    name: claim tolerances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: artifact tolerances
        run: python scripts/check_claims.py