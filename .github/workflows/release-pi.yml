name: release-pi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.triple }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-unknown-linux-gnu, kind: full }
          - { triple: aarch64-unknown-linux-musl, kind: static }
          - { triple: armv7-unknown-linux-gnueabihf, kind: full }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cross cargo-deb --locked
      - name: build
        run: |
          if [ "${{ matrix.kind }}" = full ]; then
            cross build --release --target ${{ matrix.triple }} -p sentil-cli -p sentil-ffi --no-default-features
          else
            cross build --release --target ${{ matrix.triple }} -p sentil-cli
          fi
      - name: stage tarball
        run: ./packaging/pi/stage.sh ${{ matrix.triple }} ${{ matrix.kind }}
      - name: build debs
        if: matrix.kind == 'full'
        run: |
          sed 's|@PREFIX@|/usr|' sentil-ffi/sentil.pc.in > sentil-ffi/sentil.pc
          cargo deb -p sentil-cli --target ${{ matrix.triple }} --no-build --output assets/
          cargo deb -p sentil-ffi --target ${{ matrix.triple }} --no-build --output assets/
      - uses: actions/upload-artifact@v4
        with:
          name: sentil-${{ matrix.triple }}
          path: assets/*

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_EVENT_TOKEN || github.token }}
          draft: true
          files: assets/**/*.{tar.gz,deb}