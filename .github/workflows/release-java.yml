name: release-java

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: build the jar without staging
        type: boolean
        default: true

jobs:
  natives:
    name: native ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, rust: x86_64-unknown-linux-gnu }
          - { os: macos-15-intel, arch: x86_64, rust: x86_64-apple-darwin }
          - { os: macos-14, arch: aarch64, rust: aarch64-apple-darwin }
          - { os: windows-latest, arch: x86_64, rust: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: build the native library
        working-directory: sentil-java
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: sentil-java/target/classes/native/

  deploy:
    name: stage to central
    needs: natives
    runs-on: ubuntu-latest
    environment: central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: gather every platform's native library
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: sentil-java/target/classes/native/
      - name: package the multi-platform jar
        working-directory: sentil-java
        run: mvn -B -Dsentil.skipNative=true -DskipTests -Prelease package
      - name: stage to the central portal
        if: github.event_name == 'push'
        working-directory: sentil-java
        run: mvn -B -Dsentil.skipNative=true -DskipTests -Prelease deploy
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}