name: release-java

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: build the jar without staging
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  natives:
    name: native ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, container: quay.io/pypa/manylinux_2_28_x86_64, arch: x86_64, rust: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, container: quay.io/pypa/manylinux_2_28_aarch64, arch: aarch64, rust: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, arch: x86_64, rust: x86_64-apple-darwin }
          - { os: macos-14, arch: aarch64, rust: aarch64-apple-darwin }
          - { os: windows-2022, arch: x86_64, rust: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
      - if: runner.os == 'Linux'
        run: dnf -y module install maven:3.8
      - name: build the native library
        working-directory: sentil-java
        run: mvn -B -DskipTests package
      - if: runner.os == 'Linux'
        run: packaging/check-glibc.sh sentil-java/target/classes/native
      - name: run the offline example against the jar
        working-directory: sentil-java
        shell: bash
        run: |
          java -cp target/sentil-*.jar examples/OfflineMonitoring.java | tr -d '\r' | grep -x 'robustness: -1.0'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: sentil-java/target/classes/native/

  deploy:
    name: stage to central
    needs: natives
    runs-on: ubuntu-latest
    environment: central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: gather every platform's native library
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: sentil-java/target/classes/native/
      - name: package the multi-platform jar
        working-directory: sentil-java
        run: mvn -B -Dsentil.skipNative=true -DskipTests -Prelease package
      - name: check every platform is in the jar
        working-directory: sentil-java
        run: |
          for f in linux-x86_64/libsentil{,_jni}.so linux-aarch64/libsentil{,_jni}.so \
                   darwin-x86_64/libsentil{,_jni}.dylib darwin-aarch64/libsentil{,_jni}.dylib \
                   windows-x86_64/sentil{,_jni}.dll; do
            unzip -l target/sentil-*[0-9].jar "native/$f" >/dev/null || { echo "the jar carries no native/$f"; exit 1; }
          done
      - name: attach the jar to the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_EVENT_TOKEN || github.token }}
          draft: true
          files: sentil-java/target/sentil-*[0-9].jar
      - name: stage to the central portal
        if: github.event_name == 'push'
        working-directory: sentil-java
        run: mvn -B -Dsentil.skipNative=true -DskipTests -Prelease deploy
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}