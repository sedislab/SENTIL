name: release-arduino

# Cross-compiles the static library for each board architecture and assembles the
# Arduino library, with the precompiled archives placed where Arduino's build
# expects them. Runs on a version tag or by hand; the archive is staged, never
# pushed to the Library Manager without the authors' action.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  archives:
    name: archive ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: thumbv7em-none-eabihf, mcu: cortex-m4 }
          - { target: thumbv6m-none-eabi, mcu: cortex-m0plus }
          - { target: riscv32imc-unknown-none-elf, mcu: esp32c3 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build the archive
        working-directory: sentil-embedded/rust
        run: cargo build --release --features mcu --target ${{ matrix.target }}
      - name: stage the archive
        run: |
          mkdir -p "stage/${{ matrix.mcu }}"
          cp "sentil-embedded/rust/target/${{ matrix.target }}/release/libsentil_embedded.a" \
            "stage/${{ matrix.mcu }}/libsentil_embedded.a"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.mcu }}
          path: stage/${{ matrix.mcu }}

  bundle:
    name: assemble the library
    needs: archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: archives
      - name: assemble Sentil-1.0.0
        run: |
          lib="Sentil-1.0.0"
          mkdir -p "$lib/src" "$lib/examples"
          cp sentil-embedded/library.properties "$lib/"
          cp sentil-embedded/README.md "$lib/" 2>/dev/null || true
          cp LICENSE-MIT LICENSE-APACHE "$lib/"
          cp sentil-embedded/src/Sentil.h sentil-embedded/src/Sentil.cpp "$lib/src/"
          cp -r sentil-embedded/examples/. "$lib/examples/"
          for d in archives/archive-*; do
            mcu=$(basename "$d" | sed 's/^archive-//')
            mkdir -p "$lib/src/$mcu"
            cp "$d/libsentil_embedded.a" "$lib/src/$mcu/"
          done
          zip -r "$lib.zip" "$lib"
      - uses: actions/upload-artifact@v4
        with:
          name: arduino-library
          path: Sentil-1.0.0.zip
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Sentil-1.0.0.zip