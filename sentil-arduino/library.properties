author=Paapa Kwesi Quansah, Ernest Bonnah, SEDIS Lab
maintainer=Paapa Kwesi Quansah <paapa_quansah1@baylor.edu>
sentence=Runtime verification with Signal Temporal Logic on a microcontroller.
paragraph=Monitors a stream of sensor readings against a temporal-logic specification and reports the quantitative robustness at every step, the same engine used in the wider SENTIL toolkit. This is the deterministic streaming monitor only; statistical model checking, synthesis, and the GPU paths a board cannot host are left out. The streaming cost is flat per sample with memory proportional to the window, not the trace.
category=Data Processing
